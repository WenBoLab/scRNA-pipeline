project: pbmc3k
seed: 0
output_dir: results/pbmc3k
input:
  mode: demo
  path: data/raw/pbmc3k_counts.h5ad
  samples: config/samples.tsv
qc:
  min_genes: 200
  max_genes: 2500
  max_pct_mt: 5.0
  min_cells_per_gene: 3
  mitochondrial_prefix: MT-
  sample_overrides: {}
doublets:
  enabled: true
  remove: true
  expected_rate: 0.04
  threshold: null
normalization:
  target_sum: 10000
  n_hvg: 2000
embedding:
  n_pcs: 40
  n_neighbors: 15
  resolution: 1.0
  tsne: true
  integration: none
  batch_key: batch
annotation:
  markers: config/markers.yaml
  manual_labels: null
  minimum_score: 0.1
  minimum_margin: 0.08
markers:
  min_log2fc: 0.25
  max_adjusted_p: 0.05
enrichment:
  gmt: resources/reactome_2022.gmt
  min_genes: 5
  max_genes: 500
  top_n: 200
