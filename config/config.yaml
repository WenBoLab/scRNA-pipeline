# 从仓库根目录运行。相对路径以仓库根目录为基准。
project: pbmc3k
seed: 0
output_dir: results/pbmc3k
input:
  mode: demo                    # demo / samples
  path: data/raw/pbmc3k_counts.h5ad
  samples: config/samples.tsv
qc:
  min_genes: 200
  max_genes: 2500
  max_pct_mt: 5.0
  min_cells_per_gene: 3
  mitochondrial_prefix: MT-
  sample_overrides: {}           # 例如 sample_A: {max_pct_mt: 15}
doublets:
  enabled: true
  remove: true
  expected_rate: 0.04            # 教学起点；按上样细胞数与实验信息调整
  threshold: null               # null = Scrublet 自动阈值，阈值写入报告
normalization:
  target_sum: 10000
  n_hvg: 2000
embedding:
  n_pcs: 40
  n_neighbors: 15
  resolution: 1.0
  tsne: true
  integration: none             # none / harmony；单样本不可启用 harmony
  batch_key: batch
annotation:
  markers: config/markers.yaml
  manual_labels: null           # cluster,cell_type,evidence 三列 TSV
  minimum_score: 0.10
  minimum_margin: 0.08
markers:
  min_log2fc: 0.25
  max_adjusted_p: 0.05
enrichment:
  gmt: resources/reactome_2022.gmt  # 人类 Reactome_2022 固定快照；null 可跳过
  min_genes: 5
  max_genes: 500
  top_n: 200
