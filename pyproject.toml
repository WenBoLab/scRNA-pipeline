[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scrna-seq-learning"
version = "0.1.0"
description = "A reproducible scRNA-seq teaching pipeline with a Chinese guide and PBMC3k"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "scanpy==1.11.5", "anndata==0.12.3", "numpy==2.2.6",
  "pandas==2.2.3", "scipy==1.15.3", "matplotlib==3.10.6",
  "scikit-learn==1.7.2", "numba==0.61.2", "seaborn==0.13.2",
  "igraph==0.11.9", "leidenalg==0.10.2", "scikit-image==0.25.2",
  "PyYAML==6.0.3", "snakemake==9.26.1", "harmonypy==0.0.10",
  "pydeseq2==0.5.2",
]

[dependency-groups]
dev = ["pytest==8.4.2"]
tutorial = ["nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==6.30.1", "jupyterlab==4.4.9"]

[project.scripts]
scrna-learn = "scrna_learn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scrna_learn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
